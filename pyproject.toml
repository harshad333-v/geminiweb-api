[project]
name = "gemini-web2api"
version = "1.2.0"
description = "Unified OpenAI-compatible API gateway for Gemini Web and document processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
streaming = ["httpx>=0.25"]
pdf = ["pypdf>=4.0"]
xlsx = ["openpyxl>=3.1"]
documents = ["pypdf>=4.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
gemini-web2api = "gemini_web2api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gemini_web2api*"]
