name: Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[streaming,documents]"
      - name: Compile package
        run: python -m compileall -q gemini_web2api
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
